# 2g heap: 4g OOM-crashed the daemon on this 16 GB Windows machine (native malloc failed).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3
android.useAndroidX=true
android.enableJetifier=true

# Gradle daemon configuration to prevent connection failures
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=true
org.gradle.workers.max=1

# Kotlin daemon configuration
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m

# Longer timeouts for slow/unstable Maven downloads
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=2000

# TLS for Maven/Google artifact downloads on Windows
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3

# 16 KB page size support is handled in build.gradle.kts via packaging options
